# Somnium CTF Registration Portal — backend services.
#
# The app image is PULLED, never built here. Building on the society server
# competes with live apps for its 2 vCPU / 4 GB and can trigger the OOM killer
# mid-event. GitHub Actions builds and pushes to GHCR.

services:
  app:
    # Pin to a commit SHA for anything running during an event:
    #   image: ghcr.io/creative-computing-society/ctf-registration-portal:a1b2c3d
    image: ${IMAGE:-ghcr.io/creative-computing-society/ctf-registration-portal:latest}
    container_name: ${APP_NAME:-somnium-api}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    expose:
      - "3000"

    networks:
      - coolify
      - internal

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: somnium-db
    restart: unless-stopped
    ports:               #DELETE IN DEPLOYMENT
      - "5433:5432" 
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-somnium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-somnium}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal            # internal only — never on the coolify network
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-somnium}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: somnium-redis
    restart: unless-stopped
    ports:               #DELETE IN DEPLOYMENT
      - "6380:6379"
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - internal            # internal only
    deploy:
      resources:
        limits:
          memory: 96M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  coolify:
    external: true          # created by Coolify; the proxy reaches you here
  internal:
    driver: bridge          # private: app <-> db <-> redis, not reachable from outside

volumes:
  db-data:
